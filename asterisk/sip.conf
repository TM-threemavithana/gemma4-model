; =============================================================================
; Asterisk SIP Configuration — Gemma 4 AI Calling Agent
; =============================================================================
; File: /etc/asterisk/sip.conf
;
; Copy this file to your Asterisk config:
;   sudo cp sip.conf /etc/asterisk/sip.conf
;   sudo asterisk -rx "sip reload"
;
; This configures ONE SIP softphone extension (1000 / gemmaphone).
; You will enter these credentials in Linphone or Zoiper on your phone.
;
; Softphone settings to enter in Linphone/Zoiper:
;   SIP Username : gemmaphone
;   SIP Password : gemma1234
;   Domain/Server: <your WSL2 IP address>  (run: hostname -I in WSL2)
;   Port         : 5060
; =============================================================================

[general]
context=default
allowoverlap=no
udpbindaddr=0.0.0.0
tcpenable=no
tcpbindaddr=0.0.0.0
transport=udp
srvlookup=yes

; Codecs — allow both PCMU (G.711 μ-law) and PCMA (G.711 A-law)
; These are the most compatible for VoIP and AudioSocket
disallow=all
allow=ulaw
allow=alaw

; ─────────────────────────────────────────────────────────────────────────────
; SIP Extension for your Linphone/Zoiper softphone
; ─────────────────────────────────────────────────────────────────────────────
[gemmaphone]
type=friend
secret=gemma1234            ; password — change this!
host=dynamic                ; softphone can register from any IP
context=default             ; use the dialplan context above
callerid=You <1000>
dtmfmode=rfc2833
nat=force_rport,comedia     ; helps with NAT traversal
qualify=yes                 ; ping the phone to check it's online

; ─────────────────────────────────────────────────────────────────────────────
; Optional: Add a second softphone (e.g., for testing two callers)
; ─────────────────────────────────────────────────────────────────────────────
; [gemmaphone2]
; type=friend
; secret=gemma5678
; host=dynamic
; context=default
; callerid=Phone2 <2000>
; dtmfmode=rfc2833
; nat=force_rport,comedia
; qualify=yes
