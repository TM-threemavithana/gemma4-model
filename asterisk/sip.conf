[general]
context=default
allowoverlap=no
udpbindaddr=0.0.0.0
bindport=5070                ; Use 5070 to bypass carrier blocking!
tcpenable=no
srvlookup=yes
transport=udp
nat=force_rport,comedia      ; Important for Mobile Hotspots!
directmedia=no               ; Prevents audio from trying to bypass NAT

