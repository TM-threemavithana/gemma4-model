; =============================================================================
; Asterisk Modules Configuration — enable AudioSocket
; =============================================================================
; File: /etc/asterisk/modules.conf
;
; Copy this file to your Asterisk config:
;   sudo cp modules.conf /etc/asterisk/modules.conf
;   sudo asterisk -rx "module reload"
;
; Key module we MUST enable: app_audiosocket.so
; =============================================================================

[modules]
autoload=yes

; ── Force-load AudioSocket (critical for this project) ──────────────────────
load => app_audiosocket.so

; ── Explicitly load SIP and core modules (usually loaded by autoload=yes) ───
load => chan_sip.so
load => app_dial.so
load => app_playback.so
load => app_echo.so
load => app_answer.so
load => codec_ulaw.so
load => codec_alaw.so
load => res_rtp_asterisk.so

; ── Suppress noisy modules we don't use ─────────────────────────────────────
noload => chan_dahdi.so
noload => chan_mgcp.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => res_adsi.so
