; =============================================================================
; Asterisk Dialplan — Gemma 4 AI Calling Agent
; =============================================================================
; File: /etc/asterisk/extensions.conf
;
; Copy this file to your Asterisk config:
;   sudo cp extensions.conf /etc/asterisk/extensions.conf
;   sudo asterisk -rx "dialplan reload"
;
; What this does:
;   - Extension 1000: Connects caller to Gemma 4 AI via AudioSocket bridge
;   - Extension 9999: Echo test (hear your own voice back — for debugging)
;   - Extension 8888: Playback test (plays built-in Asterisk sound file)
; =============================================================================

[general]
static=yes
writeprotect=no
autofallthrough=yes

; ─────────────────────────────────────────────────────────────────────────────
; Default context — all SIP phones land here after dialing
; ─────────────────────────────────────────────────────────────────────────────
[default]

; ── Extension 1000: Gemma 4 AI Voice Agent ──────────────────────────────────
;
; AudioSocket(UUID, host:port)
;   UUID      : a unique identifier for this connection (any UUID v4)
;   host:port : where asterisk_bridge.py is listening
;
; IMPORTANT: The UUID in extensions.conf and in asterisk_bridge.py must match
;            if you want to route specific calls. For a single-agent setup,
;            any UUID works — the bridge accepts all connections.
;
exten => 1000,1,Answer()
exten => 1000,2,Wait(1)
exten => 1000,3,AudioSocket(00000000-0000-0000-0000-000000000001,192.168.96.1:9093)
exten => 1000,4,Hangup()

; ── Extension 9999: Echo test ────────────────────────────────────────────────
; Speak into the phone — you'll hear yourself back with a short delay.
; Use this to verify your SIP connection is working before testing the AI.
exten => 9999,1,Answer()
exten => 9999,2,Echo()
exten => 9999,3,Hangup()

; ── Extension 8888: Playback test ────────────────────────────────────────────
; Plays the built-in "hello-world" audio file.
; Use this to verify Asterisk audio playback is working.
exten => 8888,1,Answer()
exten => 8888,2,Playback(hello-world)
exten => 8888,3,Hangup()

; ── Catch-all: invalid extension ─────────────────────────────────────────────
exten => i,1,Answer()
exten => i,2,Playback(invalid)
exten => i,3,Hangup()

exten => t,1,Hangup()

; ─────────────────────────────────────────────────────────────────────────────
; World 2: Outside World (Twilio Inbound)
; ─────────────────────────────────────────────────────────────────────────────
[from-twilio]
; Route all incoming calls to the AI assistant
exten => _+X.,1,Answer()
exten => _+X.,2,Wait(1)
; We use a unique UUID for external calls so the bridge can identify them
exten => _+X.,3,AudioSocket(00000000-0000-0000-0000-000000000002,192.168.96.1:9093)
exten => _+X.,4,Hangup()
